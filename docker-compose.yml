version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: fitme_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: fitme

  fitme-backend:
    build:
      context: ./fitme-backend
      dockerfile: Dockerfile
    container_name: fitme_backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/fitme
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_URL=http://localhost:5173
    volumes:
      - ./fitme-backend:/app
      - /app/node_modules

  fitme-frontend:
    build:
      context: ./fitme-frontend
      dockerfile: Dockerfile
    container_name: fitme_frontend
    ports:
      - "5173:80"
    depends_on:
      - fitme-backend
    environment:
      - VITE_API_URL=http://localhost:5000/api
    volumes:
      - ./fitme-frontend:/app
      - /app/node_modules

volumes:
  mongodb_data:
